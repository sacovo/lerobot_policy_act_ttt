[project]
name = "lerobot_policy_act_ttt"
version = "0.1.0"
description = "ACT policy with Test-Time Tuning (TTT) for LeRobot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandro Covo" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["robotics", "lerobot", "imitation-learning", "test-time-tuning", "act"]
dependencies = [
    "lerobot>=0.4.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1"
]

[project.urls]
Homepage = "https://github.com/sacovo/lerobot_policy_act_ttt"
Repository = "https://github.com/sacovo/lerobot_policy_act_ttt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "v0.5.1" }


[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=9.0.2"]
